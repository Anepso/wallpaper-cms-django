{% extends "base.html" %}

{% block content %}
<!-- Section Wallpaper Terbaru -->
<section class="py-12 bg-white">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl md:text-3xl font-bold text-gray-800">Wallpaper Terbaru</h2>
    </div>
    
    {% if latest_wallpapers %}
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-1">
      {% for wallpaper in latest_wallpapers %}
        <a href="{% url 'wallpapers:detail' wallpaper.slug %}">
          <div class="aspect-square overflow-hidden rounded-md shadow">
            <img 
              src="{% if wallpaper.thumbnail %}{{ wallpaper.thumbnail.url }}{% else %}{{ wallpaper.image.url }}{% endif %}" 
              alt="{{ wallpaper.title }}"
              class="object-cover w-full h-full transition-transform duration-200 hover:scale-105">
          </div>
        </a>
      {% endfor %}
    </div>
    {% else %}
    <p class="text-gray-500 text-sm">Belum ada wallpaper tersedia.</p>
    {% endif %}
  </div>
</section>
{% endblock %}
