{% extends "base.html" %}
{% block title %}Hasil Pencarian: {{ query }}{% endblock %}

{% block content %}
<div class="container mx-auto py-10 px-4">
  <h1 class="text-2xl font-bold mb-4 text-gray-800">Hasil untuk "{{ query }}"</h1>
  
  {% if wallpapers %}
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
    {% for wallpaper in wallpapers %}
    <a href="{% url 'wallpapers:detail' wallpaper.slug %}">
      <img src="{% if wallpaper.thumbnail %}{{ wallpaper.thumbnail.url }}{% else %}{{ wallpaper.image.url }}{% endif %}" 
           alt="{{ wallpaper.title }}" class="w-full h-auto rounded-lg shadow">
    </a>
    {% endfor %}
  </div>
  {% else %}
  <p class="text-gray-500 mt-4">Tidak ada wallpaper yang cocok.</p>
  {% endif %}
</div>
{% endblock %}
