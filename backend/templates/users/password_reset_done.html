{% extends 'home.html' %}

{% block title %}Email Terkirim{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center">Email Terkirim</h2>
    
    <div class="space-y-4">
        <p class="text-sm text-gray-600">
            Kami telah mengirimkan instruksi untuk mengatur ulang password Anda. 
            Jika email tidak diterima dalam beberapa menit, periksa folder spam Anda.
        </p>
        
        <a href="{% url 'login' %}" 
           class="block text-center text-blue-600 hover:underline">
            Kembali ke halaman login
        </a>
    </div>
</div>
{% endblock %}
