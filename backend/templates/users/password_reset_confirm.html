{% extends 'home.html' %}

{% block title %}Setel Ulang Password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center">Setel Ulang Password</h2>
    
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label for="new_password1" class="block text-sm font-medium text-gray-700">Password Baru</label>
            <input type="password" name="new_password1" id="new_password1" required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
        </div>
        
        <div>
            <label for="new_password2" class="block text-sm font-medium text-gray-700">Konfirmasi Password Baru</label>
            <input type="password" name="new_password2" id="new_password2" required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
        </div>
        
        <button type="submit" 
                class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors">
            Setel Ulang Password
        </button>
    </form>
</div>
{% endblock %}
