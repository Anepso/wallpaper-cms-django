{% extends 'base_admin.html' %}
{% block title %}Tambah Pengguna{% endblock %}

{% block content %}
<div class="container mx-auto py-10 max-w-lg">
    <h1 class="text-2xl font-bold mb-6">Tambah Pengguna Baru</h1>

    <div class="bg-white rounded-xl shadow-md p-6">
        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username <span class="text-red-500">*</span></label>
                <input type="text" name="username" id="id_username" required value="{{ form.username.value|default:'' }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                       placeholder="Username baru">
                {{ form.username.errors }}
            </div>

            <div>
                <label for="id_email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email" id="id_email" value="{{ form.email.value|default:'' }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                       placeholder="email@contoh.com">
                {{ form.email.errors }}
            </div>

            <div>
                <label for="id_password1" class="block text-sm font-medium text-gray-700 mb-1">Password <span class="text-red-500">*</span></label>
                <input type="password" name="password1" id="id_password1" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                {{ form.password1.errors }}
            </div>

            <div>
                <label for="id_password2" class="block text-sm font-medium text-gray-700 mb-1">Konfirmasi Password <span class="text-red-500">*</span></label>
                <input type="password" name="password2" id="id_password2" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                {{ form.password2.errors }}
            </div>

            <div>
                <label for="id_role" class="block text-sm font-medium text-gray-700 mb-1">Peran</label>
                <select name="role" id="id_role"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    <option value="user" {% if form.role.value == 'user' %}selected{% endif %}>Regular User</option>
                    <option value="admin" {% if form.role.value == 'admin' %}selected{% endif %}>Admin</option>
                </select>
            </div>

            <div class="pt-4 flex justify-end gap-2 border-t border-gray-200">
                <a href="{% url 'users:user-list' %}"
                   class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition">
                    Batal
                </a>
                <button type="submit"
                        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">
                    Simpan Pengguna
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
