{% extends "base_admin.html" %}
{% block title %}Dashboard Admin{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">Dashboard Admin</h1>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <div class="bg-white rounded-xl p-6 shadow-md">
    <h2 class="text-gray-700 mb-2">Total Wallpaper</h2>
    <p class="text-3xl font-bold text-blue-600">{{ total_wallpapers }}</p>
  </div>
  <div class="bg-white rounded-xl p-6 shadow-md">
    <h2 class="text-gray-700 mb-2">Total Pengguna</h2>
    <p class="text-3xl font-bold text-green-600">{{ total_users }}</p>
  </div>
</div>
{% endblock %}
