{% extends 'base_admin.html' %}
{% block title %}Upload Wallpaper{% endblock %}

{% block content %}
<div class="container mx-auto py-6 px-4 sm:px-6 lg:px-8 max-w-2xl">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Upload Wallpaper Baru</h1>
    <form method="post" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}
        
        <div class="space-y-4">
            <!-- Judul -->
            <div>
                <label for="id_title" class="block text-sm font-medium text-gray-700 mb-1">Judul</label>
                <input type="text" name="title" id="id_title" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="Masukkan judul deskriptif untuk wallpaper">
            </div>
            
            <!-- Deskripsi -->
            <div>
                <label for="id_description" class="block text-sm font-medium text-gray-700 mb-1">Deskripsi <span class="text-gray-500">(Opsional)</span></label>
                <textarea name="description" id="id_description" rows="3"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="Deskripsi wallpaper"></textarea>
            </div>
            
            <!-- File Gambar -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-3">Gambar Wallpaper*</label>
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-4 text-center transition hover:border-blue-400">
                        <div id="image-preview" class="mb-3 flex justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <label class="cursor-pointer">
                            <span class="px-4 py-2.5 bg-blue-50 text-blue-600 rounded-lg font-medium hover:bg-blue-100 transition">
                                Pilih File
                            </span>
                            <input type="file" name="image" id="id_image" class="hidden" accept="image/jpeg,image/png" required>
                        </label>
                        <p class="text-gray-400 text-sm mt-2">Format: JPG/PNG, Maksimal 10MB</p>
                        {{ form.image.errors }}
                    </div>
                </div>
            
            <!-- Kategori -->
            <div>
                <label for="id_category" class="block text-sm font-medium text-gray-700 mb-1">Kategori</label>
                <select name="category" id="id_category" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="">--- Pilih kategori ---</option>
                    {% for value, label in form.category.field.choices %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- Tag -->
            <div>
                <label for="id_tags" class="block text-sm font-medium text-gray-700 mb-1">Tag</label>
                <input type="text" name="tags" id="id_tags"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="Pisahkan tag dengan koma">
            </div>
            
            <!-- Dimensi -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="id_width" class="block text-sm font-medium text-gray-700 mb-1">Lebar (px)</label>
                    <input type="number" name="width" id="id_width" value="1920" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="id_height" class="block text-sm font-medium text-gray-700 mb-1">Tinggi (px)</label>
                    <input type="number" name="height" id="id_height" value="1080" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>
            
            <!-- Konten Premium -->
            <div class="flex items-center">
                <input type="checkbox" name="is_premium" id="id_is_premium"
                    class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                <label for="id_is_premium" class="ml-2 block text-sm text-gray-700">Centang jika ini adalah konten premium</label>
            </div>
        </div>
        
        <!-- Tombol Upload -->
        <div class="pt-2">
            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Upload
            </button>
        </div>
    </form>
</div>

<!-- Image Preview Script -->
<script>
document.getElementById('id_image').addEventListener('change', function(e) {
    const previewContainer = document.getElementById('image-preview');
    if (e.target.files.length > 0) {
        previewContainer.innerHTML = '';
        const preview = document.createElement('img');
        preview.src = URL.createObjectURL(e.target.files[0]);
        preview.className = 'max-h-48 rounded-lg shadow-sm border border-gray-200';
        previewContainer.appendChild(preview);
    }
});
</script>
{% endblock %}
